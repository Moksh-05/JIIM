name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Setup environment and keystore
        run: |
          cp .env.example .env 2>/dev/null || touch .env
          echo "" | base64 -d > debug.keystore

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Extract Version
        id: get_version
        run: |
          VERSION_NAME=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | cut -d'"' -f2)
          echo "version=v${VERSION_NAME}" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JIIM-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Automatically Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: JIIM ${{ steps.get_version.outputs.version }} • Update
          body: |
            ### JIIM Automated Release
            - Built directly from source
            - Jim AI Strength & Biomechanics Coach (Gemini)
            - Minimalist high-contrast MacroFactor design
            - Custom dumbbell logo and improved workout logger
          draft: false
          prerelease: false
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
